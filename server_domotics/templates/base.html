<!DOCTYPE html>

<html lang="es">
{% load static %}
<head>
    <meta charset=""utf-8 />

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Domotics I&V</title>
    <link rel="icon" type="image/png" href="{% static 'images/house-plants.png' %}">
    <link href="{% static 'vendor/bootstrap.min.css' %}" rel="stylesheet">
    
    <link rel="stylesheet" type="text/css" href="{% static 'styles/estilos.css' %}">

</head>
<body>
    <nav class="navbar navbar-expand-lg bg-dark border-bottom border-body " data-bs-theme="dark">
        
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img class="px-1" src="{% static 'images/house-plants.png' %}" alt="Italian Trulli" width="40px">
                Domotics I&V
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
              <ul class="navbar-nav">
                <li class="nav-item">
                  <a class="nav-link" aria-current="page" href="{% url 'home' %}">Home</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="{% url 'dispositivos' %}">Dispositivos</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="{% url 'reglas' %}">Reglas</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="{% url 'eventos' %}">Eventos</a>
                </li>
              </ul>
            </div>
        </div>
          
    </nav>

    {% block title %}    {% endblock %}
    
    {% block content %}<!-- default content text (typically empty) -->{% endblock %}

    

    <script src="{% static 'vendor/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
