{% extends "base.html" %}


{% block title %}
<div class="header-devices">
    <div class="title-devices title-center">
        Editar regla
     </div>
</div>


{% endblock %}
  

{% block content %}


<form method="post">
    {% csrf_token %}
    <div class="form-container">
        <div class="mb-3 form-field2">
            <label for="exampleInputEmail1" class="form-label">Nombre:</label>
            <div>
                {{form.name}}
            </div>
        </div>

        <div class="mb-3 form-field2">
            <label for="exampleInputEmail1" class="form-label">Dispositivos causante:</label>
            <div id="select-device1">
                {{form.device1}}
            </div>
        </div>

        <div class="mb-3 form-field2">
            <label for="exampleInputEmail1" class="form-label">Comparación:</label>
            <div>
                {{form.comparator}}
            </div>
        </div>

        <div class="mb-3 form-field2">
            <label for="exampleInputEmail1" class="form-label">Valor a comparar:</label>
            <div>
                {{form.value}}
            </div>
        </div>

        <div class="mb-3 form-field2">
            <label for="exampleInputEmail1" class="form-label">Dispositivo afectado:</label>
            <div>
                {{form.device2}}
            </div>
        </div>

        <div class="mb-3 form-field2">
            <label for="exampleInputEmail1" class="form-label">Acción:</label>
            <div>
                {{form.turn_on}}
            </div>
        </div>
        
        <div class="mb-3 error-message">
            {{error_message}}
        </div>
        
        <button type="submit" class="btn btn-primary">Confirmar cambios</button>
    </div>
    
  </form>
{% endblock %}
